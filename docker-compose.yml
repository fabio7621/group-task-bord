services:
  mongo:
    image: mongo:7
    # 第 5、7、8 節需要的交易只在 replica set 上運作，單節點也要 --replSet
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # 第一次跑會初始化 replica set，等到自己變成 primary 才算健康
      test: >
        mongosh --quiet --eval "
          try { rs.status() } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}) };
          quit(db.hello().isWritablePrimary ? 0 : 1)
        "
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 5s

  server:
    build: ./server
    environment:
      PORT: 4000
      MONGO_URI: mongodb://mongo:27017/fridge-board?replicaSet=rs0
      JWT_SECRET: ${JWT_SECRET:?請先複製 .env.example 成 .env}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
    ports:
      - "${SERVER_PORT:-4000}:4000"
    depends_on:
      mongo:
        condition: service_healthy

  web:
    build: ./web
    environment:
      API_TARGET: http://server:4000
    ports:
      - "${WEB_PORT:-5173}:5173"
    depends_on:
      - server

volumes:
  mongo-data:
